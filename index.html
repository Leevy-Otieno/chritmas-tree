<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Golden Christmas Tree Animation</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <!-- Main SVG Graphic Container -->
  <svg class="mainSVG" viewBox="0 0 800 650" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Particle Templates used by JavaScript -->
      <polygon id="star" class="particle" points="4.55,0 5.95,2.85 9.1,3.3 6.82,5.52 7.36,8.65 4.55,7.17 1.74,8.65 2.27,5.52 0,3.3 3.14,2.85" />
      <circle id="circ" class="particle" cx="4" cy="4" r="4" />
      <path id="cross" class="particle" d="M0,4 h8 M4,0 v8" />
      <path id="heart" class="particle" d="M2.9,0C2.53,0,2.2,0.18,2,0.47C1.8,0.18,1.47,0,1.1,0C0.49,0,0,0.49,0,1.1C0,2.4,2,3.6,2,3.6S4,2.4,4,1.1C4,0.49,3.51,0,2.9,0Z" />
    </defs>

    <!-- Full Winding Christmas Tree Silhouette Path & Mask -->
    <g class="tree">
      <path class="treePathMask" fill="none" stroke="#FFD700" stroke-width="3" d="M300,500 C320,460 480,460 500,500 C470,430 450,400 460,370 C420,380 380,380 340,370 C350,400 330,430 300,500 C330,410 360,340 370,300 C340,310 310,300 290,270 C320,260 360,250 380,230 C370,190 390,150 400,100 C410,150 430,190 420,230 C440,250 480,260 510,270 C490,300 460,310 430,300 C440,340 470,410 500,500" />
      <path class="treeBottomPath" fill="none" stroke="none" d="M370,520 H430" />
      <path class="treePotMask" fill="none" stroke="#DAA520" stroke-width="6" d="M370,520 H430 V570 H370 Z" />
    </g>

    <g class="sparkle"></g>
    <!-- Particle Motion Path matching the tree structure -->
    <path class="treePath" fill="none" stroke="none" d="M300,500 C320,460 480,460 500,500 C470,430 450,400 460,370 C420,380 380,380 340,370 C350,400 330,430 300,500 C330,410 360,340 370,300 C340,310 310,300 290,270 C320,260 360,250 380,230 C370,190 390,150 400,100 C410,150 430,190 420,230 C440,250 480,260 510,270 C490,300 460,310 430,300 C440,340 470,410 500,500" />
    
    <!-- Golden Tree Star -->
    <polygon class="treeStar" points="400,70 408,92 432,95 414,110 420,132 400,120 380,132 386,110 368,95 392,92" fill="#FFD700" />
    <polygon class="treeStarOutline" points="400,70 408,92 432,95 414,110 420,132 400,120 380,132 386,110 368,95 392,92" fill="none" stroke="#FFF8DC" stroke-width="2" />
    
    <!-- End Message Text (Positioned safely below the tree pot) -->
    <text id="endMessage" x="400" y="610">Merry Christmas &amp; Happy New Year!</text>
  </svg>

  <div class="pContainer"></div>

  <!-- GSAP Core & Plugins -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://assets.codepen.io/16327/MorphSVGPlugin3.min.js"></script>
  <script src="https://assets.codepen.io/16327/MotionPathPlugin.min.js"></script>
  <script src="https://assets.codepen.io/16327/Physics2DPlugin3.min.js"></script>
  <script src="https://assets.codepen.io/16327/DrawSVGPlugin3.min.js"></script>

  <!-- Main Animation Logic -->
  <script src="index.js"></script>
</body>
</html>
